<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
<main>
  <!-- Figma: 01 Cover -->
  <section class="view cover" id="cover-view">
    <h1 class="project-header">
      <span class="project-header__text">projects</span>
      <span class="ellipse-1"><img src="assets/ellipse-1.svg" alt=""></span>
    </h1>
    <div class="hero">
      <img class="hero-shape" src="assets/hero-shape.svg" alt="">
      <a class="sd-favicon-icon" href="#deck" aria-label="Open the card deck"><img src="assets/sd-favicon-icon.svg" alt=""></a>
    </div>
  </section>

  <!-- Figma: 02.01 - sickdays/start -->
  <section class="view deck-view" id="deck-view" hidden>
    <a class="back-button" href="#cover" aria-label="Back to cover"><img src="assets/back-ellipse.svg" alt=""></a>
    <header class="sickdays-header">
      <img class="sd-favicon" src="assets/sd-favicon.svg" alt="">
      <h1 class="logo-text">ickdays</h1>
    </header>
    <div class="deck-frame">
      <!-- deck1=before shows slots 1-3; first interaction expands to deck1=after (7 slots) -->
      <div class="deck" id="deck-cards">
        <button class="card" data-back="light" aria-label="Face-down card"></button>
        <div class="pair" data-state="start">
          <button class="back-dark" aria-label="Slide card aside"></button>
          <div class="pair__pink"><button class="card" data-back="pink" aria-label="Pink card, face down"></button></div>
        </div>
        <!-- Queen slot: stays queen-diamonds; second click goes to projects/ -->
        <button class="card" data-back="light" data-face="queen" data-href="projects/" aria-label="Face-down card"></button>
        <button class="card" data-back="light" aria-label="Face-down card"></button>
        <div class="pair" data-state="start">
          <button class="back-dark" aria-label="Slide card aside"></button>
          <div class="pair__pink"><button class="card" data-back="pink" aria-label="Pink card, face down"></button></div>
        </div>
        <button class="card" data-back="light" aria-label="Face-down card"></button>
        <button class="card" data-back="light" aria-label="Face-down card"></button>
      </div>
    </div>
  </section>
</main>
<script src="scripts/main.js" defer></script>
</body>
</html>
